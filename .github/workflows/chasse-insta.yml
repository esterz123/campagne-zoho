name: Chasse Insta H24

# Chrono UTC : 08h30 et 18h30 = 10h30 et 20h30 Paris
# Pipeline complet de chasse Instagram :
#   1. Collecte EN MASSE de nouvelles entreprises locales (API officielle
#      recherche-entreprises, secteurs a forte presence Insta)
#   2. Recherche du compte Instagram de chaque entreprise (ddgs/DuckDuckGo)
#   3. Generation des DM personnalises (nom dirigeant + probleme + portfolio)
#   4. Push auto des resultats + notification Discord si nouveau travail
# La file Insta ne s'epuise JAMAIS : chaque run ajoute des cibles.

on:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chasse-insta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Installer dependances
        run: |
          pip install ddgs -q 2>&1 | tail -1 || true
          python3 -c "from lxml import etree; print('lxml OK')"

      - name: Collecter les nouvelles entreprises (API officielle)
        run: |
          python3 collecteur_masse.py 2>&1 | tail -12

      - name: Chercher les comptes Instagram (ddgs)
        run: |
          python3 chercheur_insta_masse.py --max 150 2>&1 | tail -12

      - name: Verifier les comptes (anti-mauvais-compte + stats)
        run: |
          python3 verificateur_insta.py 2>&1 | tail -5

      - name: Generer les DM personnalises (stats reelles)
        run: |
          python3 generateur_dm_perso.py 2>&1 | tail -5

      - name: Generer le kit HTML cliquable
        run: |
          python3 kit_html_masse.py 2>&1 | tail -3

      - name: Commit + push si changement
        run: |
          git config user.name "campagne-bot"
          git config user.email "campagne-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chasse insta: nouvelles cibles + DM" -q
            git pull --rebase origin main -q 2>&1 | tail -1 || true
            git push origin main -q
            echo "PUSH_OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Rien de nouveau, pas de commit." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notifier Discord si nouveau travail
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          if not webhook:
              print("Pas de webhook, skip")
              exit(0)
          try:
              insta = json.load(open("masse_insta.json", encoding="utf-8"))
          except Exception:
              insta = []
          try:
              dms = json.load(open("kit_dm_masse.json", encoding="utf-8"))
          except Exception:
              dms = []

          if not insta and not dms:
              print("Rien, silence.")
              exit(0)

          nouveau = [t for t in insta if t.get("instagram")]
          msg = "📸 CHASSE INSTA : %d comptes trouves, %d DM prets\n\n" % (len(nouveau), len(dms))
          for t in nouveau[:6]:
              msg += "- %s | %s | %s\n" % (t.get("nom", "?")[:35], t.get("dirigeant", "?"), t.get("instagram", ""))
          if len(nouveau) > 6:
              msg += "... et %d autres. Kit : kit_dm_instagram.html\n" % (len(nouveau) - 6)
          else:
              msg += "Kit : kit_dm_instagram.html\n"

          payload = json.dumps({"content": msg[:1900]}).encode()
          req = urllib.request.Request(webhook, data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "campagne-bot"})
          urllib.request.urlopen(req, timeout=20)
          print("Notification Discord envoyee")
          EOF
