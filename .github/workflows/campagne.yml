name: Campagne emails Zoho

# Chrono en temps universel (UTC) calibre sur l'heure des DESTINATAIRES (France, UTC+2 en ete) :
#   Le B2B FR ouvre sa boite le matin (meilleur taux de reponse 8h-11h, etude Belkins 7.5M envois).
#   06h30 UTC = 08h30 Paris   -> run 1 : envoi + chasse + rapport
#   08h30 UTC = 10h30 Paris   -> run 2 : envoi seul (1 email)
#   12h00 UTC = 14h00 Paris   -> run 3 : envoi seul (1 email)
# Chaque run n'envoie QU'UN email (--max 1) pour espacer et eviter le look robot (Zoho).
# 3 emails/jour dans la fenetre la plus receptive (matin/debut d'apres-midi).
on:
  schedule:
    - cron: '30 6 * * *'    # 08h30 Paris (7j/7 - weekend inclus, decision Mahdi 16/08)
    - cron: '30 8 * * *'    # 10h30 Paris
    - cron: '0 12 * * *'    # 14h00 Paris
    - cron: '0 14 * * *'    # 16h00 Paris (ajoute 13/08 : 6/jour)
    - cron: '0 16 * * *'    # 18h00 Paris
    - cron: '0 17 * * *'    # 19h00 Paris
  workflow_dispatch:          # bouton "Run workflow" = envoyer maintenant
    inputs:
      go2:
        description: "GO nominatifs seuls (SIMI + ITPLAST), sans envois normaux"
        type: boolean
        default: false

jobs:
  campagne:
    runs-on: ubuntu-latest
    # AUDIT 31/08: serialise les runs (crons + fallback dispatch du Chef) pour
    # empecher deux runs simultanes de lire le meme state et double-envoyer.
    concurrency:
      group: campagne
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight (test_campagne.py) - aucun envoi si un test echoue
        run: python3 test_campagne.py

      - name: Envoi emails (rotation 5 boites, espaces dans la journee)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_B2_CLIENT_ID: ${{ secrets.ZOHO_B2_CLIENT_ID }}
          ZOHO_B2_CLIENT_SECRET: ${{ secrets.ZOHO_B2_CLIENT_SECRET }}
          ZOHO_B2_REFRESH_TOKEN: ${{ secrets.ZOHO_B2_REFRESH_TOKEN }}
          ZOHO_B2_ACCOUNT_ID: ${{ secrets.ZOHO_B2_ACCOUNT_ID }}
          ZOHO_B3_CLIENT_ID: ${{ secrets.ZOHO_B3_CLIENT_ID }}
          ZOHO_B3_CLIENT_SECRET: ${{ secrets.ZOHO_B3_CLIENT_SECRET }}
          ZOHO_B3_REFRESH_TOKEN: ${{ secrets.ZOHO_B3_REFRESH_TOKEN }}
          ZOHO_B3_ACCOUNT_ID: ${{ secrets.ZOHO_B3_ACCOUNT_ID }}
          ZOHO_B4_CLIENT_ID: ${{ secrets.ZOHO_B4_CLIENT_ID }}
          ZOHO_B4_CLIENT_SECRET: ${{ secrets.ZOHO_B4_CLIENT_SECRET }}
          ZOHO_B4_REFRESH_TOKEN: ${{ secrets.ZOHO_B4_REFRESH_TOKEN }}
          ZOHO_B4_ACCOUNT_ID: ${{ secrets.ZOHO_B4_ACCOUNT_ID }}
          ZOHO_B5_CLIENT_ID: ${{ secrets.ZOHO_B5_CLIENT_ID }}
          ZOHO_B5_CLIENT_SECRET: ${{ secrets.ZOHO_B5_CLIENT_SECRET }}
          ZOHO_B5_REFRESH_TOKEN: ${{ secrets.ZOHO_B5_REFRESH_TOKEN }}
          ZOHO_B5_ACCOUNT_ID: ${{ secrets.ZOHO_B5_ACCOUNT_ID }}
          # 2e domaine mahdi-design.fr (B6-B10) : secrets ajoutes au 1er euro, ignorés tant qu absents
          ZOHO_B6_CLIENT_ID: ${{ secrets.ZOHO_B6_CLIENT_ID }}
          ZOHO_B6_CLIENT_SECRET: ${{ secrets.ZOHO_B6_CLIENT_SECRET }}
          ZOHO_B6_REFRESH_TOKEN: ${{ secrets.ZOHO_B6_REFRESH_TOKEN }}
          ZOHO_B6_ACCOUNT_ID: ${{ secrets.ZOHO_B6_ACCOUNT_ID }}
          ZOHO_B7_CLIENT_ID: ${{ secrets.ZOHO_B7_CLIENT_ID }}
          ZOHO_B7_CLIENT_SECRET: ${{ secrets.ZOHO_B7_CLIENT_SECRET }}
          ZOHO_B7_REFRESH_TOKEN: ${{ secrets.ZOHO_B7_REFRESH_TOKEN }}
          ZOHO_B7_ACCOUNT_ID: ${{ secrets.ZOHO_B7_ACCOUNT_ID }}
          ZOHO_B8_CLIENT_ID: ${{ secrets.ZOHO_B8_CLIENT_ID }}
          ZOHO_B8_CLIENT_SECRET: ${{ secrets.ZOHO_B8_CLIENT_SECRET }}
          ZOHO_B8_REFRESH_TOKEN: ${{ secrets.ZOHO_B8_REFRESH_TOKEN }}
          ZOHO_B8_ACCOUNT_ID: ${{ secrets.ZOHO_B8_ACCOUNT_ID }}
          ZOHO_B9_CLIENT_ID: ${{ secrets.ZOHO_B9_CLIENT_ID }}
          ZOHO_B9_CLIENT_SECRET: ${{ secrets.ZOHO_B9_CLIENT_SECRET }}
          ZOHO_B9_REFRESH_TOKEN: ${{ secrets.ZOHO_B9_REFRESH_TOKEN }}
          ZOHO_B9_ACCOUNT_ID: ${{ secrets.ZOHO_B9_ACCOUNT_ID }}
          ZOHO_B10_CLIENT_ID: ${{ secrets.ZOHO_B10_CLIENT_ID }}
          ZOHO_B10_CLIENT_SECRET: ${{ secrets.ZOHO_B10_CLIENT_SECRET }}
          ZOHO_B10_REFRESH_TOKEN: ${{ secrets.ZOHO_B10_REFRESH_TOKEN }}
          ZOHO_B10_ACCOUNT_ID: ${{ secrets.ZOHO_B10_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.go2 }}" = "true" ]; then
            python3 campagne_zoho.py --go2
          else
            python3 campagne_zoho.py --max 4
          fi

      - name: Chasse de nouveaux prospects (1x/jour seulement)
        run: |
          today=$(date +%Y-%m-%d)
          if [ ! -f ".chasse_$today" ]; then
            python3 chasseur_prospects.py || echo "chasse finie (limite ou erreur)"
            touch ".chasse_$today"
          else
            echo "chasse deja faite aujourd'hui, skip"
          fi

      - name: Reconciliation etat (verite terrain boites, anti-doublons)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_B2_CLIENT_ID: ${{ secrets.ZOHO_B2_CLIENT_ID }}
          ZOHO_B2_CLIENT_SECRET: ${{ secrets.ZOHO_B2_CLIENT_SECRET }}
          ZOHO_B2_REFRESH_TOKEN: ${{ secrets.ZOHO_B2_REFRESH_TOKEN }}
          ZOHO_B2_ACCOUNT_ID: ${{ secrets.ZOHO_B2_ACCOUNT_ID }}
          ZOHO_B3_CLIENT_ID: ${{ secrets.ZOHO_B3_CLIENT_ID }}
          ZOHO_B3_CLIENT_SECRET: ${{ secrets.ZOHO_B3_CLIENT_SECRET }}
          ZOHO_B3_REFRESH_TOKEN: ${{ secrets.ZOHO_B3_REFRESH_TOKEN }}
          ZOHO_B3_ACCOUNT_ID: ${{ secrets.ZOHO_B3_ACCOUNT_ID }}
          ZOHO_B4_CLIENT_ID: ${{ secrets.ZOHO_B4_CLIENT_ID }}
          ZOHO_B4_CLIENT_SECRET: ${{ secrets.ZOHO_B4_CLIENT_SECRET }}
          ZOHO_B4_REFRESH_TOKEN: ${{ secrets.ZOHO_B4_REFRESH_TOKEN }}
          ZOHO_B4_ACCOUNT_ID: ${{ secrets.ZOHO_B4_ACCOUNT_ID }}
          ZOHO_B5_CLIENT_ID: ${{ secrets.ZOHO_B5_CLIENT_ID }}
          ZOHO_B5_CLIENT_SECRET: ${{ secrets.ZOHO_B5_CLIENT_SECRET }}
          ZOHO_B5_REFRESH_TOKEN: ${{ secrets.ZOHO_B5_REFRESH_TOKEN }}
          ZOHO_B5_ACCOUNT_ID: ${{ secrets.ZOHO_B5_ACCOUNT_ID }}
        run: python3 reconcilie_etat.py

      - name: Sauvegarde etat + nouveaux prospects
        run: |
          git config user.name "campagne-bot"
          git config user.email "campagne-bot@users.noreply.github.com"
          git add -A
          git commit -m "campagne: etat du jour + nouvelles fiches" || echo "rien a commiter"
          # Course git avec les autres workflows (dashboard/closer) : rebase + retry avant push
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash 2>/dev/null && git push; then
              echo "etat sauvegarde (tentative $i)"
              break
            fi
            echo "push rejete (tentative $i), nouvelle tentative dans 15s..."
            sleep 15
          done

      - name: Bouclier anti-bounce (protege la delivrabilite des 5 boites)
        if: ${{ always() }}
        run: python3 bounce_shield.py

      - name: Notifier Discord (rapport du jour)
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify_discord.py

      - name: Notifier erreur sur Discord
        if: ${{ failure() && env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify_discord.py --error
