name: Scraper annuaires H24

# Chrono UTC : 08h00 et 16h00 = 10h00 et 18h00 Paris
# Scrape les annuaires sectoriels (Polyvia, AEPV...) depuis l'IP cloud GitHub
# Rythme courtois : ~150-200 entreprises/run, 2 runs/jour = ~300-400/jour
# Filtre vetuste (score>=2) + dirigeant via API INSEE + verrou domaine=site
on:
  schedule:
    - cron: '0 8 * * 1-5'     # 10h00 Paris
    - cron: '0 16 * * 1-5'    # 18h00 Paris
  workflow_dispatch:           # bouton = scraper maintenant

jobs:
  scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Scrape Polyvia (150 max, filtrage vetuste + dirigeant)
        run: python3 scraper_annuaires.py --source polyvia --max 150 --threads 4

      - name: Scrape AEPV (150 max)
        run: python3 scraper_annuaires.py --source aepv --max 150 --threads 4

      - name: Sauvegarde reserve
        run: |
          git config user.name "campagne-bot"
          git config user.email "campagne-bot@users.noreply.github.com"
          git add -A
          git commit -m "scraper: reserve de prospects mise a jour" || echo "rien a commiter"
          git push

      - name: Notifier erreur sur Discord
        if: ${{ failure() && env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify_discord.py --error
